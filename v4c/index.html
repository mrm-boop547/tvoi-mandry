<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>tvoi.mandry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
:root{--outer:#E9E9E9;--site:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--outer:#1A1A1A}}
:root[data-theme="dark"]{--outer:#1A1A1A}
html,body{background:var(--outer)}
*{-webkit-tap-highlight-color:transparent}
#app{max-width:430px;margin:0 auto;background:var(--site);min-height:100dvh;position:relative;overflow-x:clip}
@media (min-width:600px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 60px rgba(0,0,0,.12)}}
html{scroll-behavior:smooth}
/* зручні для пальця цілі: мінімум 44 px по висоті */
#app footer a{min-height:44px;display:inline-flex;align-items:center}
#app footer span{gap:0 !important}
#app header > a:not([aria-label]){min-height:44px;display:inline-flex;align-items:center}
#totop{position:fixed;z-index:60;right:max(16px,calc((100vw - 430px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.92);color:#111;
  box-shadow:0 6px 20px rgba(17,17,17,.18),0 1px 3px rgba(17,17,17,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;
  transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1),bottom .35s cubic-bezier(.16,1,.3,1)}
#totop.show{opacity:1;transform:none;pointer-events:auto}
#totop.above-bar{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

.sbar.off{transform:translate(-50%,28px) scale(.96)!important;opacity:0;pointer-events:none}
.sfade.off{opacity:0}
#toast{position:fixed;z-index:70;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:#111;color:#fff;font:500 14px/1 'Inter Tight',system-ui,sans-serif;padding:12px 16px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#lb{position:fixed;inset:0;z-index:100;background:rgba(8,10,12,.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease;touch-action:pan-y}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.94);transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .25s ease;user-select:none;-webkit-user-drag:none}
#lb.open img{transform:none}
#lb button{position:absolute;width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#lb .x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
#lb .pv{left:12px;top:50%;margin-top:-22px}#lb .nx{right:12px;top:50%;margin-top:-22px}
#lb .cap{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.85);font:500 14px/1.4 'Inter Tight',system-ui,sans-serif;text-align:center}
#lb .cnt{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font:500 13px 'Inter Tight',system-ui,sans-serif}
#totop:focus-visible{outline:2px solid #F2491D;outline-offset:2px}
/* ---- motion: тільки функціональні анімації (зміна екрана, перемикання турів, розгортання, шторка, плашка бронювання) ---- */
@media (prefers-reduced-motion: no-preference){
  .scr-in{animation:scrIn .25s ease both}
  @keyframes scrIn{from{opacity:0}to{opacity:1}}
  .swap{animation:swap .3s ease both}
  @keyframes swap{from{opacity:0}to{opacity:1}}
  .sbar{transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s ease;will-change:transform,opacity}
  .sbar.off{transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .2s ease}
  .sfade{transition:opacity .3s ease}
  a,button{transition:transform .15s ease}
  @media (hover:hover){a img{transition:transform 1.2s cubic-bezier(.16,1,.3,1)} a:hover img{transform:scale(1.035)}}
}
body{margin:0}
html{scrollbar-width:thin;scrollbar-color:rgba(17,17,17,0.18) transparent}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(17,17,17,0.18);border-radius:2px}
.mrow{scrollbar-width:none}.mrow::-webkit-scrollbar{display:none}
a{color:#111111}a:hover{color:#555555}
.page>*{flex-shrink:0}
a{color:#111111}
input::placeholder{color:#A3A3A3}
</style>
<style>body{margin:0;font-family:"Inter Tight",system-ui,sans-serif}img{max-width:100%}</style>
</head>
<body>

<div id="app"></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Фото"><span class="cnt"></span><img alt=""><span class="cap"></span>
<button class="x" type="button" aria-label="Закрити"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<button class="pv" type="button" aria-label="Попереднє фото"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nx" type="button" aria-label="Наступне фото"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="totop" type="button" aria-label="Нагору сторінки"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
<template id="tpl-MainV4"><div class="page" style="width: 100%; min-height: 100dvh; box-sizing: border-box; background: #FFFFFF; font-family: 'Inter Tight', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 72px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF">
<span style="font-weight: 600; font-size: 19px; letter-spacing: -0.6px; color: #111111">tvoi<span style="color: {{acc}}">.</span>mandry</span>
<a href="MenuV3.dc.html" aria-label="Меню" style="box-sizing: border-box; width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F4F4; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"></path></svg></a>
</header>

<section style="position: relative; margin: 0; height: 540px; overflow: hidden; border-radius: 0px; background: #1E2830">
<img alt="Група мандрівників йде хребтом у Карпатах" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 64.2177% 100%; " src="img/crop_390ab91a_86241.jpg">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(180deg, rgba(10,14,18,0) 0%, rgba(10,14,18,0.5) 45%, rgba(10,14,18,0.82) 100%)"></div>
<div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0px; font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -1.3px; color: #ffffff">Авторські фототури, після яких залишаються друзі та спогади на все життя!<br></h1>
<a href="#tours" style="text-decoration: none; height: 60px; padding: 0 8px 0 22px; gap: 12px; border-radius: 30px; background: {{acc}}; color: {{accInk}}; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between"><span>Обери свою мандрівку</span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transform: rotate(180deg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></span></a>
</div>
</section>

<section style="margin: 34px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-weight: 500; font-size: clamp(24px, 7.6vw, 30px); letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums">85+</span><span style="font-size: 14px; color: #6B6B6B">мандрівок</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-weight: 500; font-size: clamp(24px, 7.6vw, 30px); letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums">1000+</span><span style="font-size: 14px; color: #6B6B6B">мандрівників</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-weight: 500; font-size: clamp(24px, 7.6vw, 30px); letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums">4 роки</span><span style="font-size: 14px; color: #6B6B6B">в мандрах</span></div>
</section>

<section id="tours" style="margin: 34px 0 0; padding: 36px 0 28px; background: #111111; color: #FFFFFF; border-radius: 0px; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0 16px; font-weight: 500; font-size: 34px; line-height: 1.05; letter-spacing: -1.4px; color: #FFFFFF">Обери <span style="color: rgb(154, 154, 154)">свою мандрівку:</span></h2>
<div class="mrow" role="tablist" aria-label="Фільтр мандрівок" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 12px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}<span style="{{f.cntStyle}}">{{f.cnt}}</span></button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 12px">
<sc-for list="{{tours}}" as="t" hint-placeholder-count="6"><a href="{{t.href}}" data-tour="{{t.id}}" data-d="{{t.di}}" style="position: relative; display: block; height: 264px; text-decoration: none; color: #FFFFFF; background: #1E2830; border-radius: 14px; overflow: hidden; min-width: 0"><div style="position: absolute; inset: 0">
<sc-if value="{{t.is_gen}}" hint-placeholder-val="{{false}}"><img src="img/tours/ph.jpg" alt="{{t.name}}" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{t.is_kup}}" hint-placeholder-val="{{false}}"><img src="img/fa7c6e21a710a87534cfe3b8b1c95703.jpg" alt="Івана Купала" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{t.is_shp}}" hint-placeholder-val="{{false}}"><img src="img/crop_e8992a52_89412.jpg" alt="Шпиці та Червона Рута" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 68.9336% 75.9011%; "></sc-if><sc-if value="{{t.is_rot}}" hint-placeholder-val="{{false}}"><img src="img/6ace0c60fc1ff65e799998fabaed3463.jpg" alt="Ротило та Комори Довбуша" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{t.is_sec}}" hint-placeholder-val="{{false}}"><img src="img/0e37070598a5a2093770abeac4f5a8ce.jpg" alt="Секретна подорож" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{t.is_dra}}" hint-placeholder-val="{{false}}"><img src="img/9832bcc0cbb15d22bef3f95f94a2c4c7.jpg" alt="Драгобрат" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{t.is_bak}}" hint-placeholder-val="{{false}}"><img src="img/bb85142f4c469e600cd4a53a37804f07.jpg" alt="Бакота" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{t.is_pip}}" hint-placeholder-val="{{false}}"><img src="img/efb98218d63a5047618b5502e6704c31.jpg" alt="Піп Іван" style="display: block; width: 100%; height: 100%; object-fit: cover"></sc-if>
<span style="{{t.badgeStyle}}"><span style="{{t.dotStyle}}"></span>{{t.seats}}</span>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%; background: linear-gradient(180deg, rgba(10,14,18,0) 0%, rgba(10,14,18,0.6) 38%, rgba(10,14,18,0.88) 100%)"></div>
</div><span style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 12px; color: rgba(255,255,255,0.85)">{{t.dates}}</span><span style="font-size: 12px; color: rgba(255,255,255,0.7)">{{t.meta}}</span><span style="height: 1px; margin: 6px 0 5px; background: rgba(255,255,255,0.28)"></span><span style="font-weight: 600; font-size: 17px; line-height: 1.15; letter-spacing: -0.3px">{{t.name}}</span><span style="font-size: 14px; font-weight: 500">{{t.price}}<span style="color: rgba(255,255,255,0.7); font-weight: 400">{{t.per}}</span></span></span></a></sc-for>
</div><h3 style="margin: 22px 16px 0; font-weight: 500; font-size: 28px; line-height: 1.05; letter-spacing: -1px; color: #FFFFFF">Усі мандрівки <span style="color: rgb(154, 154, 154)">· {{tourCount}}</span></h3><a href="CalendarV4.dc.html" style="margin: 6px 12px 0; text-decoration: none; height: 56px; padding: 0 8px 0 20px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.35); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between"><span>Усі дати в календарі</span><span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<sc-if value="{{noTours}}" hint-placeholder-val="{{false}}"><p style="margin: 0 16px; font-size: 16px; line-height: 1.45; color: rgba(255,255,255,0.75)">Дати на цей сезон анонсуємо найближчим часом. Глянь «Усі» або напиши нам у Direct.</p></sc-if>

</section>

<section id="reviews" style="padding: 72px 0 0; display: flex; flex-direction: column; gap: 18px">

<h2 style="margin: 0 16px; font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -1.3px">Що кажуть <span style="color: rgb(138, 138, 138)">після мандрів:</span></h2>
<div style="position: relative">
<div class="mrow" ref="{{setRev}}" style="display: flex; gap: 8px; padding: 0 72px 0 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: 12px">
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; overflow: hidden; background: #1E2834"><img src="img/tours/rev-1.jpg" alt="Відгук: Марія" data-zoom="1" data-cap="Марія" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; cursor: zoom-in"></div>
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; overflow: hidden; background: #1E2834"><img src="img/tours/rev-2.jpg" alt="Відгук: Олександр" data-zoom="1" data-cap="Олександр" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; cursor: zoom-in"></div>
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; color: #6B6B6B; padding: 12px; box-sizing: border-box">скрін сторіз з відгуком</div>
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; color: #6B6B6B; padding: 12px; box-sizing: border-box">скрін переписки</div>
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; color: #6B6B6B; padding: 12px; box-sizing: border-box">скрін сторіз з відгуком</div>
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; color: #6B6B6B; padding: 12px; box-sizing: border-box">скрін переписки</div>
<div style="flex-shrink: 0; scroll-snap-align: start; width: 150px; height: 260px; border-radius: 10px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; color: #6B6B6B; padding: 12px; box-sizing: border-box">скрін сторіз з відгуком</div>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 96px; height: 260px; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, #FFFFFF 60%); pointer-events: none"></div>
<button aria-label="Наступні відгуки" onClick="{{revNext}}" style="position: absolute; top: 108px; right: 12px; width: 44px; height: 44px; border-radius: 22px; border: none; background: #111111; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</section>

<section id="photo" style="padding: 64px 0 0; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0 16px; font-weight: 500; font-size: 34px; line-height: 1.05; letter-spacing: -1.4px">У нас формат фототуру -<br>ти гуляєш, <span style="color: rgb(138, 138, 138)">ми знімаємо</span></h2>
<p style="margin: 0 16px; font-size: 17px; line-height: 1.5; color: #444444">Фотограф їде з групою, тож ти повертаєшся з десятками твоїх кадрів. Можна приїхати з ідеєю образу, або просто насолоджуватися горами поки ми знімаємо вас.</p>
<div class="mrow" data-marquee="1" aria-label="Фото учасників з минулих мандрівок" style="display: flex; gap: 8px; padding: 8px 12px 0; overflow-x: auto">
<sc-for list="{{gal1}}" as="g" hint-placeholder-count="6">
<div style="flex-shrink: 0; width: 150px; height: 200px; border-radius: 10px; overflow: hidden; background: #F4F4F4"><img src="{{g.src}}" alt="Учасник мандрівки tvoi.mandry" data-zoom="1" data-cap="" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in"></div>
</sc-for>
<sc-for list="{{gal2}}" as="g" hint-placeholder-count="6">
<div style="flex-shrink: 0; width: 150px; height: 200px; border-radius: 10px; overflow: hidden; background: #F4F4F4"><img src="{{g.src}}" alt="Учасник мандрівки tvoi.mandry" data-zoom="1" data-cap="" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in"></div>
</sc-for>
</div>
</section>

<section id="about" style="margin: 64px 0 0; padding: 36px 16px 20px; background: #F4F4F4; border-radius: 0px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-weight: 500; font-size: 34px; line-height: 1.05; letter-spacing: -1.4px">Привіт, ми <br><span style="color: rgb(138, 138, 138)">Мар’ян і Тарас</span></h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #444444">Четвертий рік збираємо людей у мандри!</p>
<a href="AboutV4.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 8px; border-radius: 14px; background: #FFFFFF; color: #111111">
