<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>tvoi.mandry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
:root{--outer:#E9E9E9;--site:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--outer:#1A1A1A}}
:root[data-theme="dark"]{--outer:#1A1A1A}
html,body{background:var(--outer)}
*{-webkit-tap-highlight-color:transparent}
#app{max-width:430px;margin:0 auto;background:var(--site);min-height:100dvh;position:relative;overflow-x:clip}
@media (min-width:600px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 60px rgba(0,0,0,.12)}}
html{scroll-behavior:smooth}
#totop{position:fixed;z-index:60;right:max(16px,calc((100vw - 430px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.92);color:#111;
  box-shadow:0 6px 20px rgba(17,17,17,.18),0 1px 3px rgba(17,17,17,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;
  transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1),bottom .35s cubic-bezier(.16,1,.3,1)}
#totop.show{opacity:1;transform:none;pointer-events:auto}
#totop.above-bar{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

.sbar.off{transform:translate(-50%,28px) scale(.96)!important;opacity:0;pointer-events:none}
.sfade.off{opacity:0}
#toast{position:fixed;z-index:70;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:#111;color:#fff;font:500 14px/1 'Inter Tight',system-ui,sans-serif;padding:12px 16px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#lb{position:fixed;inset:0;z-index:100;background:rgba(8,10,12,.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease;touch-action:pan-y}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.94);transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .25s ease;user-select:none;-webkit-user-drag:none}
#lb.open img{transform:none}
#lb button{position:absolute;width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#lb .x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
#lb .pv{left:12px;top:50%;margin-top:-22px}#lb .nx{right:12px;top:50%;margin-top:-22px}
#lb .cap{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.85);font:500 14px/1.4 'Inter Tight',system-ui,sans-serif;text-align:center}
#lb .cnt{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font:500 13px 'Inter Tight',system-ui,sans-serif}
#totop:focus-visible{outline:2px solid #F2491D;outline-offset:2px}
/* ---- motion: спокійні, «епплівські» анімації ---- */
@media (prefers-reduced-motion: no-preference){
  .scr-in{animation:scrIn .5s ease both}
  @keyframes scrIn{from{opacity:0}to{opacity:1}}
  .kb{animation:kb 2.4s cubic-bezier(.16,1,.3,1) both;will-change:transform}
  @keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
  .hd-in{animation:hdIn 1s .25s cubic-bezier(.16,1,.3,1) both}
  @keyframes hdIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  .up{animation:up 1.1s cubic-bezier(.16,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .rv{opacity:0;transform:translateY(36px) scale(.985);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1)}
  .rv.in{opacity:1;transform:none}
  .swap{animation:swap .7s cubic-bezier(.16,1,.3,1) both}
  @keyframes swap{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
  .tl-dot{transform:scale(.3);opacity:0;transition:transform .8s .25s cubic-bezier(.34,1.56,.64,1),opacity .4s .25s ease}
  .in .tl-dot{transform:none;opacity:1}
  .tl-line{transform:scaleY(0);transform-origin:top;transition:transform 1.4s .55s cubic-bezier(.16,1,.3,1)}
  .in .tl-line{transform:none}
  .tl-card{opacity:0;transform:translateX(18px);transition:opacity .9s .15s cubic-bezier(.16,1,.3,1),transform 1.1s .15s cubic-bezier(.16,1,.3,1)}
  .in .tl-card{opacity:1;transform:none}
  .sbar{transition:transform 1s cubic-bezier(.22,1,.36,1),opacity .8s cubic-bezier(.22,1,.36,1);will-change:transform,opacity}
  .sbar.off{transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .45s ease}
  .sfade{transition:opacity .9s ease}
  a,button{transition:transform .2s cubic-bezier(.16,1,.3,1)}
  a:active,button:active{transform:scale(.97)}
  @media (hover:hover){a img{transition:transform 1.2s cubic-bezier(.16,1,.3,1)} a:hover img{transform:scale(1.035)}}
}
body{margin:0}
html{scrollbar-width:thin;scrollbar-color:rgba(17,17,17,0.18) transparent}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(17,17,17,0.18);border-radius:2px}
.mrow{scrollbar-width:none}.mrow::-webkit-scrollbar{display:none}
a{color:#111111}a:hover{color:#555555}
.page>*{flex-shrink:0}
a{color:#111111}
input::placeholder{color:#A3A3A3}
</style>

<body>

<template id="tpl-MainV4"><div class="page" style="width: 100%; min-height: 100dvh; box-sizing: border-box; background: #FFFFFF; font-family: 'Inter Tight', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; overflow: hidden">

</header>

<section style="position: relative; margin: 0 12px; height: 540px; overflow: hidden; border-radius: 32px; background: #1E2830">
<img alt="Група мандрівників йде хребтом у Карпатах" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 38.5509% 98.0068%; " src="img/crop_b2a8cf9b_62075.jpg">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(180deg, rgba(10,14,18,0) 0%, rgba(10,14,18,0.5) 45%, rgba(10,14,18,0.82) 100%)"></div>
<div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0 4px; font-weight: 500; font-size: 36px; line-height: 1.04; letter-spacing: -1.5px; color: #FFFFFF"></h1><h1 style="margin: 0px; font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -1.3px; color: #ffffff">Авторські фототури, після яких залишаються друзі та спогади на все життя!<br></h1>
<a href="#tours" style="text-decoration: none; height: 60px; padding: 0 8px 0 22px; gap: 12px; border-radius: 30px; background: {{acc}}; color: {{accInk}}; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between"><span>Обери свою мандрівку</span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></span></a>
</div>
</section>

<section style="margin: 28px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-weight: 500; font-size: clamp(24px, 7.6vw, 30px); letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums">85+</span><span style="font-size: 14px; color: #6B6B6B">мандрівок</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-weight: 500; font-size: clamp(24px, 7.6vw, 30px); letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums">1000+</span><span style="font-size: 14px; color: #6B6B6B">мандрівників</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-weight: 500; font-size: clamp(24px, 7.6vw, 30px); letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums">4 роки</span><span style="font-size: 14px; color: #6B6B6B">в мандрах</span></div>
</section>

<section id="tours" style="margin: 40px 0 0; padding: 36px 0 16px; background: #111111; color: #FFFFFF; border-radius: 0px; display: flex; flex-direction: column; gap: 18px">

<div style="position: relative">

</sc-for>
</div>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</section></section>



<section id="faq" style="padding: 64px 16px 0; display: flex; flex-direction: column">
<h2 style="margin: 0 0 12px; font-weight: 500; font-size: 34px; line-height: 1.05; letter-spacing: -1.4px">Питання</h2>

// «Поділитися туром»: системне меню на телефоні, інакше копіюємо посилання
var toast = document.getElementById('toast'), toastT = null;
function say(t){ toast.textContent = t; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ toast.classList.remove('show'); }, 2200); }
document.addEventListener('click', function(e){
  var btn = e.target.closest && e.target.closest('[aria-label="Поділитися туром"]');
  if (!btn) return;
  var h1 = app.querySelector('h1'), title = h1 ? h1.textContent.trim() : 'tvoi.mandry';
  var url = location.href;
  if (navigator.share) { navigator.share({ title: title, text: title + ' · tvoi.mandry', url: url }).catch(function(){}); return; }
  var done = function(){ say('Посилання скопійовано'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function(){ say(url); });
  else say(url);
});
route(); syncTop();
})();
</script>
